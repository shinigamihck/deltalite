<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Lite - Download Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Container Utama -->
    <main class="container mx-auto px-4 py-8 max-w-2xl flex-grow">
        
        <!-- HEADER -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
                Delta Lite Portal
            </h1>
            <p class="text-slate-400 text-sm mt-1">Secure Device Session & Download Center</p>
        </header>

        <!-- 1. SECTION: AUTH KEY LOGIN -->
        <section id="auth-section" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center gap-3 mb-4">
                <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl">
                    <i class="fa-solid fa-key text-xl"></i>
                </div>
                <div>
                    <h2 class="font-bold text-lg">Autentikasi Key</h2>
                    <p class="text-xs text-slate-400">Masukkan key akses untuk membuka sesi perangkat ini.</p>
                </div>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <input type="text" id="auth-key-input" placeholder="Masukkan Auth Key..." required
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-xl transition text-sm shadow-lg shadow-blue-600/20 cursor-pointer">
                    Verifikasi Key
                </button>
                <p id="auth-error" class="text-red-400 text-xs text-center hidden">Auth key salah atau tidak aktif!</p>
            </form>
        </section>

        <!-- 2. SECTION: MAIN DASHBOARD (DOWNLOAD LIST) -->
        <section id="dashboard-section" class="hidden space-y-6">
            <!-- Info Sesi & Logout -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400">Status Sesi</p>
                        <p class="text-sm font-semibold text-emerald-400">Terproteksi di Perangkat Ini</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="text-xs bg-slate-800 hover:bg-red-500/20 hover:text-red-400 text-slate-300 px-3 py-2 rounded-lg transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>

            <!-- Tab Navigasi Folder (64Bit & 32Bit) -->
            <div class="flex gap-2 border-b border-slate-800 pb-3">
                <button onclick="switchTab('64bit')" id="tab-64bit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-blue-600 text-white transition cursor-pointer flex items-center gap-2">
                    <i class="fa-solid fa-microchip"></i> Folder 64-Bit
                </button>
                <button onclick="switchTab('32bit')" id="tab-32bit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-slate-400 hover:text-white transition cursor-pointer flex items-center gap-2">
                    <i class="fa-solid fa-cpu"></i> Folder 32-Bit
                </button>
            </div>

            <!-- Konten List 64-Bit -->
            <div id="content-64bit" class="space-y-3"></div>

            <!-- Konten List 32-Bit -->
            <div id="content-32bit" class="space-y-3 hidden"></div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer class="text-center py-6 text-xs text-slate-600">
        &copy; 2026 Delta Lite. Global Synchronized System.
    </footer>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        let globalData = { auth_key: "delta2026", downloads: { "64bit": [], "32bit": [] } };

        // Ambil data dari file data.json saat website dibuka
        async function fetchAppData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime()); // Mencegah cache browser
                if (response.ok) {
                    globalData = await response.json();
                }
            } catch (error) {
                console.error("Gagal memuat data:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchAppData();

            const sessionDevice = sessionStorage.getItem('delta_session_active');
            if (sessionDevice === 'true') {
                showDashboard();
            }
        });

        function handleAuth(e) {
            e.preventDefault();
            const inputKey = document.getElementById('auth-key-input').value.trim();

            if (inputKey === globalData.auth_key) {
                sessionStorage.setItem('delta_session_active', 'true');
                showDashboard();
            } else {
                const errEl = document.getElementById('auth-error');
                errEl.classList.remove('hidden');
                setTimeout(() => errEl.classList.add('hidden'), 3000);
            }
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            renderDownloadLists();
        }

        function handleLogout() {
            sessionStorage.removeItem('delta_session_active');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            window.location.reload();
        }

        function switchTab(type) {
            const btn64 = document.getElementById('tab-64bit');
            const btn32 = document.getElementById('tab-32bit');
            const cont64 = document.getElementById('content-64bit');
            const cont32 = document.getElementById('content-32bit');

            if (type === '64bit') {
                btn64.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-blue-600 text-white transition cursor-pointer flex items-center gap-2";
                btn32.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-slate-400 hover:text-white transition cursor-pointer flex items-center gap-2";
                cont64.classList.remove('hidden');
                cont32.classList.add('hidden');
            } else {
                btn32.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-blue-600 text-white transition cursor-pointer flex items-center gap-2";
                btn64.className = "px-4 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-slate-400 hover:text-white transition cursor-pointer flex items-center gap-2";
                cont32.classList.remove('hidden');
                cont64.classList.add('hidden');
            }
        }

        function renderDownloadLists() {
            const cont64 = document.getElementById('content-64bit');
            cont64.innerHTML = globalData.downloads['64bit'].length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">Belum ada file di folder 64-Bit.</p>' : 
                globalData.downloads['64bit'].map(item => `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between hover:border-slate-700 transition">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 bg-blue-500/10 text-blue-400 rounded-lg"><i class="fa-solid fa-file-arrow-down"></i></div>
                            <div>
                                <h4 class="text-sm font-semibold text-slate-200">${item.title}</h4>
                                <span class="text-[10px] text-blue-400 font-medium">Architecture: 64-Bit</span>
                            </div>
                        </div>
                        <a href="${item.link}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Download</a>
                    </div>
                `).join('');

            const cont32 = document.getElementById('content-32bit');
            cont32.innerHTML = globalData.downloads['32bit'].length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">Belum ada file di folder 32-Bit.</p>' : 
                globalData.downloads['32bit'].map(item => `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between hover:border-slate-700 transition">
                        <div class="flex items-center gap-3">
                            <div class="p-2.5 bg-indigo-500/10 text-indigo-400 rounded-lg"><i class="fa-solid fa-file-arrow-down"></i></div>
                            <div>
                                <h4 class="text-sm font-semibold text-slate-200">${item.title}</h4>
                                <span class="text-[10px] text-indigo-400 font-medium">Architecture: 32-Bit</span>
                            </div>
                        </div>
                        <a href="${item.link}" target="_blank" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">Download</a>
                    </div>
                `).join('');
        }
    </script>
</body>
</html>
